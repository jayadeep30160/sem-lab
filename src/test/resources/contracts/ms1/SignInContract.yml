#contract 1: check signin
request:
  method: POST
  url: /ms1/signin
  headers:
    Content-Type: "application/json"
  body:
    username: "string"
    password: "string"
response:
  status: 200
  headers:
    Content-Type: "application/json"
  body:
    code: 200
    jwt: "sample-token-string"
  matchers:
    body:
      - path: $.jwt
        type: by_regex
        value: ".+"
